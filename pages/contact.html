<style>
:root{
  --indigo:#2D5BFF;--indigo-mid:#1E44D6;--indigo-dark:#0B1026;--indigo-tint:#E9EEFF;
  --ink:#0B1026;--body-c:#474E68;--muted:#7A8199;
  --border:#DEE2EC;--border-strong:#C9CFDD;--white:#FFFFFF;--paper:#F3F5FA;
  --pr:#2D5BFF;--pr-dark:#1E44D6;--pr-tint:#E9EEFF;
  --ins:#0B1026;--ins-tint:#F3F5FA;
  --r-lg:20px;--r-md:14px;--r-sm:10px;
  --sh-sm:0 1px 3px rgba(15,18,34,.06);--sh-md:0 8px 24px rgba(15,18,34,.08);--sh-lg:0 24px 64px rgba(22,19,53,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Public Sans',sans-serif;background:var(--white);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--indigo-mid);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--indigo);outline-offset:3px}
.container{max-width:1180px;margin:0 auto;padding:0 32px}

/* Header */
.site-header{position:fixed;top:0;left:0;right:0;z-index:100;padding:13px 0;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:14px}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}
.logo-mark{display:flex;align-items:center;flex-shrink:0}
.logo-text{font-family:'Sora',sans-serif;font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.header-actions{display:flex;align-items:center;gap:12px;flex-shrink:0}
.header-cta{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--white);font-size:13px;font-weight:600;padding:10px 20px;border-radius:999px;transition:background .2s;text-decoration:none}
.header-cta:hover{background:var(--indigo);text-decoration:none}
.service-tabs{display:flex;align-items:center;gap:6px;padding:6px;background:var(--paper);border:1px solid var(--border);border-radius:999px;overflow:visible}
.service-tab{font-size:13px;font-weight:600;padding:7px 16px;border-radius:999px;color:var(--body-c);background:transparent;transition:all .2s;text-decoration:none;white-space:nowrap}
.service-tab:hover{color:var(--ink);background:rgba(15,18,34,.05);text-decoration:none}
.tab-active{background:var(--indigo);color:var(--white) !important}
.tab-active:hover{background:var(--indigo-mid)}

/* Dropdown */
.tab-dropdown{position:relative}
.tab-dropdown-btn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:7px 16px;border-radius:999px;color:var(--indigo-mid);background:var(--indigo-tint);border:none;cursor:pointer;font-family:'Public Sans',sans-serif;transition:all .2s;white-space:nowrap}
.tab-dropdown-btn:hover{background:var(--indigo);color:var(--white)}
.tab-dropdown-btn .arr{width:12px;height:12px;transition:transform .2s;flex-shrink:0;opacity:.7}
.tab-dropdown.open .tab-dropdown-btn{background:var(--indigo);color:var(--white)}
.tab-dropdown.open .arr{transform:rotate(180deg)}
.tab-dropdown-menu{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(-6px);min-width:160px;background:var(--white);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-lg);padding:6px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:200}
.tab-dropdown.open .tab-dropdown-menu{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.tab-dropdown-item{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--body-c);padding:9px 14px;border-radius:9px;transition:background .15s,color .15s;white-space:nowrap;text-decoration:none}
.tab-dropdown-item:hover{background:var(--indigo-tint);color:var(--indigo-mid);text-decoration:none}
.tab-dropdown-item .item-dot{width:7px;height:7px;border-radius:50%;background:var(--indigo);flex-shrink:0}

@media(max-width:900px){.service-tabs{display:none}}
/* Mobile hamburger */
.nav-toggle{display:none;width:40px;height:40px;align-items:center;justify-content:center;border-radius:10px;background:transparent;border:1px solid var(--border);cursor:pointer;transition:background .2s;flex-shrink:0;padding:0}
.nav-toggle:hover{background:var(--paper)}
.mobile-menu{display:none;position:fixed;inset:0;z-index:300;background:rgba(15,18,34,.55);backdrop-filter:blur(4px)}
.mobile-menu.open{display:flex;align-items:flex-start;justify-content:flex-end}
.mobile-panel{width:min(300px,88vw);height:100vh;background:var(--white);overflow-y:auto;padding:18px 22px 40px;display:flex;flex-direction:column;box-shadow:-24px 0 64px rgba(15,18,34,.14)}
.mobile-panel-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.mobile-logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.mobile-logo-text{font-family:'Sora',sans-serif;font-size:14px;font-weight:600;color:var(--ink)}
.mobile-close{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--border);background:transparent;cursor:pointer;flex-shrink:0;padding:0}
.mobile-close:hover{background:var(--paper)}
.mobile-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.mobile-nav a{font-size:15px;font-weight:600;color:var(--ink);padding:11px 14px;border-radius:10px;transition:background .2s;display:block;text-decoration:none}
.mobile-nav a:hover{background:var(--paper);text-decoration:none}
.mobile-nav a.mob-active{background:var(--indigo-tint);color:var(--indigo-mid)}
.mobile-nav .mob-sub{font-size:14px;color:var(--body-c);padding:9px 14px 9px 28px}
.mobile-divider{height:1px;background:var(--border);margin:10px 0}
.mobile-login-btn{display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--white);font-size:14px;font-weight:600;padding:13px 20px;border-radius:999px;text-decoration:none;margin-top:16px;transition:background .2s}
.mobile-login-btn:hover{background:var(--indigo);text-decoration:none}
@media(max-width:900px){.header-cta{display:none}.nav-toggle{display:flex}}

/* Hero */
.contact-hero{padding:105px 0 34px;background:var(--indigo-dark);position:relative;overflow:hidden}
.contact-hero::before{content:'';position:absolute;inset:0;background:none;pointer-events:none}
.contact-hero-inner{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 56px;align-items:end}
.contact-tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.09);color:rgba(255,255,255,.7);margin-bottom:16px;letter-spacing:.02em}
.contact-hero h1{font-family:'Sora',sans-serif;font-size:clamp(28px,3.8vw,46px);font-weight:700;color:var(--white);line-height:1.14;letter-spacing:-.015em;margin:0}
.contact-hero p{font-size:15px;color:rgba(255,255,255,.6);max-width:460px;line-height:1.7;margin:0 0 6px}
@media(max-width:820px){.contact-hero-inner{grid-template-columns:1fr;gap:12px}}

/* Contact body */
.contact-body{padding:48px 0 0}
.contact-wrap{max-width:680px;margin:0 auto;padding:0 32px}

@media(max-width:640px){
  .container{padding:0 20px}
  .contact-wrap{padding:0 20px}
  .contact-body{padding:32px 0 0}
  .ai-ghl-form{padding:0 20px!important}
}

.contact-meta{padding:40px 0 0}
.contact-nap{border:1px solid var(--border);border-radius:var(--r-md);padding:16px 20px;background:var(--paper);display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px 28px}
.contact-nap .ai-nap{font-style:normal;font-size:13.5px;line-height:1.6;color:var(--body-c);margin:0;column-count:2;column-gap:28px;max-width:none}
.contact-nap .ai-nap strong{color:var(--ink)}
.contact-nap .ai-nap a{color:var(--indigo-mid)}
.contact-own{font-size:13px;color:var(--muted);margin:0;align-self:flex-end}
.contact-own a{color:var(--indigo-mid);font-weight:600}
.contact-own .sep{margin:0 8px;color:var(--border-strong)}
@media(max-width:640px){.contact-nap .ai-nap{column-count:1}.contact-own{align-self:flex-start}}
</style>

<script>
(function() {
  var dd  = document.getElementById('specDropdown');
  var btn = document.getElementById('specDropdownBtn');
  if (!dd || !btn) return;
  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    var open = dd.classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
  });
  document.addEventListener('click', function() {
    dd.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
  });
  dd.addEventListener('click', function(e) { e.stopPropagation(); });

  /* Hamburger menu */
  var navTog = document.getElementById('navToggle');
  var mobMenu = document.getElementById('mobileMenu');
  var mobClose = document.getElementById('mobileClose');
  if (navTog && mobMenu) {
    navTog.addEventListener('click', function() {
      mobMenu.classList.add('open');
      navTog.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
    });
    function closeNav() {
      mobMenu.classList.remove('open');
      navTog.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }
    if (mobClose) mobClose.addEventListener('click', closeNav);
    mobMenu.addEventListener('click', function(e) { if (e.target === mobMenu) closeNav(); });
    mobMenu.querySelectorAll('a').forEach(function(a) { a.addEventListener('click', closeNav); });
  }
})();
</script>
