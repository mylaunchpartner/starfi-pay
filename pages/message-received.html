<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
:root{
  --indigo:#2D5BFF;--indigo-mid:#1E44D6;--indigo-dark:#0B1026;--indigo-tint:#E9EEFF;
  --ink:#0B1026;--body-c:#474E68;--muted:#7A8199;
  --border:#DEE2EC;--white:#FFFFFF;--paper:#F3F5FA;
  --r-lg:20px;--r-md:14px;
  --sh-lg:0 24px 64px rgba(22,19,53,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Public Sans',sans-serif;background:var(--white);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--indigo-mid);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--indigo);outline-offset:3px}
.container{max-width:1180px;margin:0 auto;padding:0 32px}

/* Header */
.site-header{position:fixed;top:0;left:0;right:0;z-index:100;padding:13px 0;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:14px}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}
.logo-mark{display:flex;align-items:center;flex-shrink:0}
.logo-text{font-family:'Sora',sans-serif;font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.header-actions{display:flex;align-items:center;gap:12px;flex-shrink:0}
.header-cta{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--white);font-size:13px;font-weight:600;padding:10px 20px;border-radius:999px;transition:background .2s;text-decoration:none}
.header-cta:hover{background:var(--indigo);text-decoration:none}
.service-tabs{display:flex;align-items:center;gap:6px;padding:6px;background:var(--paper);border:1px solid var(--border);border-radius:999px;overflow:visible}
.service-tab{font-size:13px;font-weight:600;padding:7px 16px;border-radius:999px;color:var(--body-c);background:transparent;transition:all .2s;text-decoration:none;white-space:nowrap}
.service-tab:hover{color:var(--ink);background:rgba(15,18,34,.05);text-decoration:none}
.tab-active{background:var(--indigo);color:var(--white)!important}
.tab-active:hover{background:var(--indigo-mid)}
.tab-dropdown{position:relative}
.tab-dropdown-btn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:7px 16px;border-radius:999px;color:var(--indigo-mid);background:var(--indigo-tint);border:none;cursor:pointer;font-family:'Public Sans',sans-serif;transition:all .2s;white-space:nowrap}
.tab-dropdown-btn:hover{background:var(--indigo);color:var(--white)}
.tab-dropdown-btn .arr{width:12px;height:12px;transition:transform .2s;flex-shrink:0;opacity:.7}
.tab-dropdown.open .tab-dropdown-btn{background:var(--indigo);color:var(--white)}
.tab-dropdown.open .arr{transform:rotate(180deg)}
.tab-dropdown-menu{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(-6px);min-width:160px;background:var(--white);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-lg);padding:6px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:200}
.tab-dropdown.open .tab-dropdown-menu{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.tab-dropdown-item{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--body-c);padding:9px 14px;border-radius:9px;transition:background .15s,color .15s;white-space:nowrap;text-decoration:none}
.tab-dropdown-item:hover{background:var(--indigo-tint);color:var(--indigo-mid);text-decoration:none}
.tab-dropdown-item .item-dot{width:7px;height:7px;border-radius:50%;background:var(--indigo);flex-shrink:0}
/* Mobile hamburger */
.nav-toggle{display:none;width:40px;height:40px;align-items:center;justify-content:center;border-radius:10px;background:transparent;border:1px solid var(--border);cursor:pointer;padding:0;flex-shrink:0}.nav-toggle:hover{background:var(--paper)}.mobile-menu{display:none;position:fixed;inset:0;z-index:300;background:rgba(15,18,34,.5)}.mobile-menu.open{display:flex;justify-content:flex-end}.mobile-panel{width:min(300px,90vw);height:100%;background:var(--white);padding:20px 22px 40px;overflow-y:auto;display:flex;flex-direction:column}.mob-x{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--border);cursor:pointer;padding:0;margin-left:auto;margin-bottom:18px;background:transparent}.mob-x:hover{background:var(--paper)}.mob-nav a{font-size:15px;font-weight:600;color:var(--ink);padding:11px 14px;border-radius:10px;display:block;text-decoration:none;transition:background .15s}.mob-nav a:hover{background:var(--paper)}.mob-hr{height:1px;background:var(--border);margin:10px 0}.mob-cta{display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--white);font-size:14px;font-weight:600;padding:13px 20px;border-radius:999px;text-decoration:none;margin-top:auto;transition:background .15s}.mob-cta:hover{background:var(--indigo)}
@media(max-width:900px){.service-tabs{display:none}.header-cta{display:none}.nav-toggle{display:flex}}

/* Confirmation section */
.thanks-top{padding:110px 0 56px;background:var(--indigo-dark);position:relative;overflow:hidden}
.thanks-top::before{content:'';position:absolute;inset:0;background:none;pointer-events:none}
.thanks-top-inner{position:relative;z-index:1;display:flex;align-items:flex-start;gap:20px}
.check-ring{width:52px;height:52px;border-radius:50%;background:rgba(45,91,255,.15);border:1px solid rgba(45,91,255,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:4px;color:#6EE8AA}
.thanks-copy h1{font-family:'Sora',sans-serif;font-size:clamp(26px,3.5vw,40px);font-weight:700;color:#fff;line-height:1.14;letter-spacing:-.015em;margin-bottom:10px}
.thanks-copy .sub{font-size:16px;color:rgba(255,255,255,.55);line-height:1.7;max-width:480px}
.cal-intro{padding:44px 0 0}
.cal-intro-inner{max-width:680px;margin:0 auto;padding:0 32px}
.cal-label{font-family:'Sora',sans-serif;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}

@media(max-width:640px){
  .container{padding:0 20px}
  .cal-intro-inner{padding:0 20px}
  .thanks-top-inner{flex-direction:column;gap:14px}
  .cal-intro{padding:36px 0 0}
}
</style>

<script>
(function() {
  var dd = document.getElementById('specDropdown');
  var btn = document.getElementById('specDropdownBtn');
  if (dd && btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var open = dd.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
    });
    document.addEventListener('click', function() {
      dd.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    });
    dd.addEventListener('click', function(e) { e.stopPropagation(); });
  }
  var nt=document.getElementById('navToggle'),mm=document.getElementById('mobileMenu'),mc=document.getElementById('mobileClose');if(nt&&mm){function cn(){mm.classList.remove('open');nt.setAttribute('aria-expanded','false');document.body.style.overflow=''}nt.onclick=function(){mm.classList.add('open');nt.setAttribute('aria-expanded','true');document.body.style.overflow='hidden'};if(mc)mc.onclick=cn;mm.onclick=function(e){if(e.target===mm)cn()};mm.querySelectorAll('a').forEach(function(a){a.onclick=cn})}
})();
</script>

.footer-brand-logo{display:flex;align-items:center;gap:10px}
.footer-col h5{font-family:'Sora',sans-serif;font-size:12px;font-weight:600;letter-spacing:.02em;color:rgba(245,184,61,.85);margin-bottom:14px}
